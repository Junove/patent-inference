openapi: 3.1.0
info:
  title: Patent Inference API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects:
    get:
      summary: List Projects
      operationId: list_projects_api_v1_projects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectOut'
                type: array
                title: Response List Projects Api V1 Projects Get
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create Project
      operationId: create_project_api_v1_projects_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/patents/search:
    get:
      summary: Search Patents
      operationId: search_patents_api_v1_patents_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
      - name: assignee
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
      - name: inventor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Inventor
      - name: classification
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Classification
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
  /api/v1/patents/{patent_id}:
    get:
      summary: Get Patent
      operationId: get_patent_api_v1_patents__patent_id__get
      parameters:
      - name: patent_id
        in: path
        required: true
        schema:
          type: string
          title: Patent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentDetail'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
  /api/v1/lint:
    post:
      summary: Lint
      operationId: lint_api_v1_lint_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_lint_api_v1_lint_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Finding'
                type: array
                title: Response Lint Api V1 Lint Post
        default:
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{project_id}/files:
    post:
      summary: Upload File
      operationId: upload_file_api_v1_projects__project_id__files_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_api_v1_projects__project_id__files_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileOut'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
    get:
      summary: List Files
      operationId: list_files_api_v1_projects__project_id__files_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileOut'
                title: Response List Files Api V1 Projects  Project Id  Files Get
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
  /api/v1/projects/{project_id}/files/{file_id}:
    delete:
      summary: Delete File
      operationId: delete_file_api_v1_projects__project_id__files__file_id__delete
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '204':
          description: Successful Response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
  /api/v1/projects/{project_id}/generate:
    post:
      summary: Generate
      operationId: generate_api_v1_projects__project_id__generate_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
  /api/v1/jobs/{job_id}/events:
    get:
      summary: Job Events
      operationId: job_events_api_v1_jobs__job_id__events_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Server-sent events
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
  /api/v1/jobs/{job_id}/cancel:
    post:
      summary: Cancel Job
      operationId: cancel_job_api_v1_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
  /api/v1/projects/{project_id}/sections/{name}/regenerate:
    post:
      summary: Regenerate Section
      operationId: regenerate_section_api_v1_projects__project_id__sections__name__regenerate_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
  /api/v1/projects/{project_id}/documents/{version}:
    get:
      summary: Download Document
      operationId: download_document_api_v1_projects__project_id__documents__version__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: version
        in: path
        required: true
        schema:
          type: integer
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {}
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Default Response
components:
  schemas:
    Body_lint_api_v1_lint_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_lint_api_v1_lint_post
    Body_upload_file_api_v1_projects__project_id__files_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_api_v1_projects__project_id__files_post
    Error:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: Error
    FileOut:
      properties:
        id:
          type: string
          title: Id
        filename:
          type: string
          title: Filename
        content_type:
          type: string
          title: Content Type
        size:
          type: integer
          title: Size
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - filename
      - content_type
      - size
      - created_at
      title: FileOut
    Finding:
      properties:
        severity:
          type: string
          enum:
          - error
          - warning
          - info
          title: Severity
        rule:
          type: string
          title: Rule
        message:
          type: string
          title: Message
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
      type: object
      required:
      - severity
      - rule
      - message
      title: Finding
    GenerateRequest:
      properties:
        instructions:
          type: string
          title: Instructions
          default: ''
        sections:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Sections
      type: object
      title: GenerateRequest
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
        version:
          type: string
          title: Version
      type: object
      required:
      - status
      - version
      title: Health
    JobId:
      properties:
        job_id:
          type: string
          title: Job Id
      type: object
      required:
      - job_id
      title: JobId
    JobStatus:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
      type: object
      required:
      - job_id
      - status
      title: JobStatus
    PatentDetail:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        abstract:
          type: string
          title: Abstract
        assignee:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
        filing_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Filing Date
        claims:
          items:
            type: string
          type: array
          title: Claims
        inventors:
          items:
            type: string
          type: array
          title: Inventors
        classification:
          items:
            type: string
          type: array
          title: Classification
        cited_patents:
          items:
            $ref: '#/components/schemas/PatentSummary'
          type: array
          title: Cited Patents
      type: object
      required:
      - id
      - title
      - abstract
      - claims
      - inventors
      - classification
      - cited_patents
      title: PatentDetail
    PatentSummary:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        abstract:
          type: string
          title: Abstract
        assignee:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
        filing_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Filing Date
      type: object
      required:
      - id
      - title
      - abstract
      title: PatentSummary
    ProjectCreate:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
      type: object
      required:
      - name
      title: ProjectCreate
    ProjectOut:
      properties:
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
          default: ''
        id:
          type: string
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - name
      - id
      - created_at
      title: ProjectOut
    RegenerateRequest:
      properties:
        instructions:
          type: string
          title: Instructions
          default: ''
      type: object
      title: RegenerateRequest
    SearchResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/PatentSummary'
          type: array
          title: Results
        total:
          type: integer
          title: Total
      type: object
      required:
      - results
      - total
      title: SearchResults
