name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: has
        working-directory: .
        run: |
          if [ -f backend/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No backend/pyproject.toml yet; skipping."; fi
      - uses: astral-sh/setup-uv@v3
        if: steps.has.outputs.present == 'true'
        with:
          python-version: "3.11"
      - name: Run pytest
        if: steps.has.outputs.present == 'true'
        run: uv run pytest

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: has
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No frontend/package.json yet; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.has.outputs.present == 'true'
        run: npm ci
      - name: Run Vitest
        if: steps.has.outputs.present == 'true'
        run: npm test
