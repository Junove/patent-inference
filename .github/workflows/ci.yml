name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: has
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No backend/requirements.txt yet; skipping."; fi
      - uses: actions/setup-python@v5
        if: steps.has.outputs.present == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        if: steps.has.outputs.present == 'true'
        run: pip install -r requirements.txt
      - name: Run pytest
        if: steps.has.outputs.present == 'true'
        run: pytest

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: has
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No frontend/package.json yet; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.has.outputs.present == 'true'
        run: npm ci
      - name: Run Vitest
        if: steps.has.outputs.present == 'true'
        run: npm test
